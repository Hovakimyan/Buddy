# XcodeGen spec for Buddy. Generate with `xcodegen` (run in this directory); Buddy.xcodeproj is git-ignored.
# BuddyMac (macOS) and BuddyPhone (iOS) share the BuddyKit package below and Shared/.
name: Buddy

options:
  bundleIdPrefix: com.sergeyhovakimyan.buddy
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing: no Apple Developer team is committed, so the default builds "to run locally" (ad-hoc). Never put a
    # Team ID here; pass it per build (docs/cloudkit-setup.md):
    #   xcodebuild ... DEVELOPMENT_TEAM=<id> CODE_SIGN_IDENTITY="Apple Development" BUDDY_ENTITLEMENTS=BuddyMac/BuddyMac.cloud.entitlements
    #   (BuddyPhone: BUDDY_ENTITLEMENTS=BuddyPhone/BuddyPhone.cloud.entitlements)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"

packages:
  BuddyKit:
    path: ..

targets:
  BuddyMac:
    type: application
    platform: macOS
    sources:
      - path: BuddyMac
        excludes:
          - Info.plist
          - BuddyMac.entitlements
          - BuddyMac.cloud.entitlements
          - Resources/sounds/**
          - "**/*.md"
      # CloudKit link and the character (SwiftUI, CloudKit and Foundation only, no AppKit): the iPhone app reuses this folder.
      - path: Shared
      # Sounds keep their folder (BuddyMac.app/Contents/Resources/sounds/block/*.wav, one subfolder per character):
      # SoundPlayer looks them up in `sounds/<character.soundFolder>`. All CC0, listed in sounds/SOURCES.md, which
      # travels with them as a folder reference.
      - path: BuddyMac/Resources/sounds
        type: folder
        buildPhase: resources
    dependencies:
      - package: BuddyKit
        product: BuddyKit
      # The hook relay is built by Xcode (same toolchain and settings as the app) before the app, and the
      # script phase below copies it next to the app's own executable:
      #   BuddyMac.app/Contents/MacOS/buddy-hook
      # AppModel installs that copy into ~/Library/Application Support/Buddy/bin/ when the user confirms
      # "Install hooks". (It lives in Contents/MacOS so it is a signed, executable helper, not a resource.)
      - target: BuddyHook
        link: false
        # No copy into Resources: without this XcodeGen adds "BuddyHook in Resources", a second, unsigned buddy-hook in
        # BuddyMac.app/Contents/Resources that notarization would reject. The only copy is the one signed in
        # Contents/MacOS by the script phase below.
        embed: false
    postBuildScripts:
      - name: Embed buddy-hook
        script: |
          set -euo pipefail
          src="${BUILT_PRODUCTS_DIR}/buddy-hook"
          dst="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/buddy-hook"
          /bin/cp -f "${src}" "${dst}"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ]; then
            identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
            if [ "${ENABLE_HARDENED_RUNTIME:-NO}" = "YES" ] && [ "${identity}" != "-" ]; then
              # Release signing (scripts/release.sh, Developer ID): same identity as the app, hardened runtime and a
              # secure timestamp (both required for notarization). No --entitlements: the helper carries none, in
              # particular no iCloud keys (those belong to the app only).
              /usr/bin/codesign --force --sign "${identity}" --options runtime --timestamp "${dst}"
            else
              # Default and development builds: unchanged (ad-hoc or development identity, no hardened runtime).
              /usr/bin/codesign --force --sign "${identity}" --timestamp=none "${dst}"
            fi
          fi
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/buddy-hook
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/buddy-hook
        basedOnDependencyAnalysis: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergeyhovakimyan.buddy.mac
        PRODUCT_NAME: BuddyMac
        INFOPLIST_FILE: BuddyMac/Info.plist
        # App icon (BuddyMac/Assets.xcassets/AppIcon.appiconset): Block, drawn by BuddyMacTests/AppIconArtTests.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The default entitlements have NO iCloud keys (they would make the ad-hoc build unlaunchable). A signed
        # build opts in with `BUDDY_ENTITLEMENTS=BuddyMac/BuddyMac.cloud.entitlements` on the xcodebuild command
        # line (see docs/cloudkit-setup.md). A dedicated variable, not CODE_SIGN_ENTITLEMENTS itself, so the
        # override reaches only this target and not the buddy-hook tool.
        BUDDY_ENTITLEMENTS: BuddyMac/BuddyMac.entitlements
        CODE_SIGN_ENTITLEMENTS: $(BUDDY_ENTITLEMENTS)
        # Not sandboxed (see the entitlements file). Hardened runtime stays off for local development.
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO

  # The `buddy-hook` relay Claude Code runs. Same sources as the SwiftPM executable product.
  BuddyHook:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/BuddyHook
    dependencies:
      - package: BuddyKit
        product: BuddyKit
    settings:
      base:
        PRODUCT_NAME: buddy-hook
        PRODUCT_MODULE_NAME: BuddyHook
        SKIP_INSTALL: YES

  # Unit tests are not hosted by the app (launching it would start a real engine on the real socket):
  # they compile the app's sources directly, minus the @main entry file.
  BuddyMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BuddyMacTests
      - path: BuddyMac
        excludes:
          - BuddyMacApp.swift
          - Info.plist
          - BuddyMac.entitlements
          - BuddyMac.cloud.entitlements
          - Assets.xcassets
          - Resources/**
          - "**/*.md"
      - path: Shared
      # Tests of Shared/ code (sanitizer, entitlement check): the same files also run in BuddyPhoneTests.
      - path: SharedTests
    dependencies:
      - package: BuddyKit
        product: BuddyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergeyhovakimyan.buddy.mac.tests
        GENERATE_INFOPLIST_FILE: YES

  # The iPhone approver. Reuses Shared/ (CloudKit transport, sanitizer, arming) and BuddyKit's models.
  BuddyPhone:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BuddyPhone
        excludes:
          - Info.plist
          - BuddyPhone.entitlements
          - BuddyPhone.cloud.entitlements
          - "**/*.md"
      - path: Shared
    dependencies:
      - package: BuddyKit
        product: BuddyKit
      # Embedded in BuddyPhone.app/PlugIns: the push service and the long-press view.
      - target: BuddyNotificationService
      - target: BuddyNotificationContent
    postBuildScripts:
      # iOS has no public API to read the app's own entitlements, so the app learns from its Info.plist whether it
      # may touch CloudKit (CloudEntitlement in Shared/CloudAvailability.swift). True only for a code signed build
      # whose entitlements file grants CloudKit for Buddy's container. Runs before Xcode's final code signing.
      - name: Record the CloudKit entitlement
        script: |
          set -euo pipefail
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          entitlements="${SRCROOT}/${CODE_SIGN_ENTITLEMENTS:-}"
          value=false
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ] && [ -n "${CODE_SIGN_ENTITLEMENTS:-}" ] && [ -f "${entitlements}" ] \
            && /usr/libexec/PlistBuddy -c "Print :com.apple.developer.icloud-services" "${entitlements}" 2>/dev/null \
              | grep -qx '[[:space:]]*CloudKit' \
            && /usr/libexec/PlistBuddy -c "Print :com.apple.developer.icloud-container-identifiers" "${entitlements}" 2>/dev/null \
              | grep -qx '[[:space:]]*iCloud\.com\.sergeyhovakimyan\.buddy'; then
            value=true
          fi
          /usr/libexec/PlistBuddy -c "Delete :BuddyCloudKit" "${plist}" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :BuddyCloudKit bool ${value}" "${plist}"
          echo "BuddyCloudKit = ${value} (${CODE_SIGN_ENTITLEMENTS:-no entitlements})"
        # The processed Info.plist as an input orders this phase after Xcode writes it; no dependency analysis, so it
        # runs on every build (switching BUDDY_ENTITLEMENTS changes nothing Xcode would otherwise notice here).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergeyhovakimyan.buddy.phone
        PRODUCT_NAME: BuddyPhone
        INFOPLIST_FILE: BuddyPhone/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # App icon (BuddyPhone/Assets.xcassets/AppIcon.appiconset, drawn by BuddyMacTests/AppIconArtTests.swift): a single
        # 1024 universal icon, which App Store Connect requires for a TestFlight upload.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # Same opt-in as the Mac: the default entitlements have NO iCloud/push keys (an ad-hoc or simulator
        # build carrying them may not launch). A signed device build passes
        # `BUDDY_ENTITLEMENTS=BuddyPhone/BuddyPhone.cloud.entitlements` (docs/cloudkit-setup.md).
        BUDDY_ENTITLEMENTS: BuddyPhone/BuddyPhone.entitlements
        CODE_SIGN_ENTITLEMENTS: $(BUDDY_ENTITLEMENTS)
        # The script phase above edits the built Info.plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # Runs when an approval or question push arrives, before iOS shows it: fetches the encrypted record and fills in
  # the real text, Buddy's picture and the actions. Its own App ID needs iCloud with Buddy's container
  # (docs/cloudkit-setup.md).
  BuddyNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BuddyNotificationService
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared/CloudKitSchema.swift
      - path: Shared/DisplayText.swift
      - path: Shared/NotificationDetail.swift
    dependencies:
      - package: BuddyKit
        product: BuddyKit
      - sdk: UserNotifications.framework
    settings:
      base:
        ENABLE_DEBUG_DYLIB: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.sergeyhovakimyan.buddy.phone.notifications
        INFOPLIST_FILE: BuddyNotificationService/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: BuddyNotificationService/BuddyNotificationService.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # The long-press view of a Buddy notification: Buddy, the whole command or question, one button per answer.
  BuddyNotificationContent:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BuddyNotificationContent
        excludes:
          - Info.plist
      - path: Shared/Characters
      - path: Shared/DisplayText.swift
      - path: Shared/NotificationDetail.swift
    dependencies:
      - package: BuddyKit
        product: BuddyKit
      # iOS looks up the extension's context class in UserNotificationsUI before any of its code runs, so the
      # executable itself must link it (with Xcode's debug dylib only that dylib would, and the extension crashed).
      - sdk: UserNotificationsUI.framework
    settings:
      base:
        ENABLE_DEBUG_DYLIB: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.sergeyhovakimyan.buddy.phone.notification-view
        INFOPLIST_FILE: BuddyNotificationContent/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # Like BuddyMacTests: not hosted by the app, it compiles the app's sources minus the @main entry file.
  BuddyPhoneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BuddyPhoneTests
      - path: BuddyPhone
        excludes:
          - BuddyPhoneApp.swift
          - Info.plist
          - BuddyPhone.entitlements
          - BuddyPhone.cloud.entitlements
          - Assets.xcassets
          - "**/*.md"
      - path: Shared
      - path: SharedTests
    dependencies:
      - package: BuddyKit
        product: BuddyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergeyhovakimyan.buddy.phone.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BuddyMac:
    build:
      targets:
        BuddyMac: all
        BuddyMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: BuddyMacTests
          randomExecutionOrder: true

  BuddyPhone:
    build:
      targets:
        BuddyPhone: all
        BuddyPhoneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: BuddyPhoneTests
          randomExecutionOrder: true
